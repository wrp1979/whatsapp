name: Build Src

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  Linux-Build:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-webengine-dev \
            qt6-webengine-dev-tools \
            qt6-positioning-dev \
            libx11-dev \
            libx11-xcb-dev
      - name: Build source
        run: ./build.sh
