name: Release Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  QT_VERSION: "6.6.3"

jobs:
  meta:
    name: Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - id: meta
        name: Compute release version
        run: |
          version=$(awk -F'=' '/^VERSION[[:space:]]*=/{gsub(/ /,"",$2); print $2; exit}' src/WhatsApp.pro)
          build="${GITHUB_RUN_NUMBER}"
          tag="v${version}-b${build}"
          name="WhatSie ${version} (build ${build})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux Packages
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-webengine-dev \
            qt6-webengine-dev-tools \
            qt6-positioning-dev \
            libx11-dev \
            libx11-xcb-dev \
            libfuse2

      - name: Download AppImage tools
        run: |
          mkdir -p "$HOME/bin"
          curl -L -o "$HOME/bin/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o "$HOME/bin/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$HOME/bin/linuxdeploy-"*.AppImage

      - name: Build
        run: BUILD_NUMBER_OVERRIDE=${{ needs.meta.outputs.build }} ./build.sh

      - name: Package
        run: ./package_linux.sh --all --no-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            build/package/out/*.deb
            build/package/out/*.AppImage

  windows:
    name: Windows Installer
    runs-on: windows-2022
    needs: meta
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtwebengine qtpositioning
          cache: true

      - name: Install NSIS
        run: choco install nsis -y

      - name: Set build number
        shell: pwsh
        run: |
          Set-Content -Path src\\BUILD_NUMBER -Value "${{ needs.meta.outputs.build }}"

      - name: Build
        shell: pwsh
        run: ./build_windows.ps1 -BuildDir build-windows -Config release

      - name: Package
        shell: pwsh
        run: ./package_windows.ps1 -BuildDir build-windows -OutDir dist/windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/windows/*.exe

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, linux, windows]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract release notes
        run: |
          awk 'BEGIN{p=0} /^## /{if(p) exit; p=1} p {print}' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.name }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
